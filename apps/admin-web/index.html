<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%235C1816'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-size='16' font-weight='700' fill='%23F46A00' text-anchor='middle'%3E5S%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The two families of the design system, and no third (GEMBA-BOARD.md §4). -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=DM+Mono:wght@400;500&display=swap"
    />
    <title>audit5s — 5S Audit Platform</title>
    <script>
      /*
       * Light (the whiteboard) or dark, never the OS preference: the attribute is always
       * stamped, so the token file's prefers-color-scheme fallback never applies. Stamped
       * here, before the first paint, rather than after React mounts. Anything else in
       * storage — a "system" left by an older build — reads as light.
       */
      try {
        var m = localStorage.getItem('gemba-theme');
        document.documentElement.setAttribute('data-theme', m === 'dark' ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
