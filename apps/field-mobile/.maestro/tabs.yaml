# Sign in and walk a field role's four tabs, screenshotting each for design review.
#
#   LOGIN_ID=SA0101 PASSWORD=... maestro test .maestro/tabs.yaml
#
# Credentials come from the environment and never live in this file. Needs the dev stack
# (`./dev.sh up`) so sign-in can reach the API.
appId: in.abassociate.audit5s
env:
  METRO_URL: http://10.0.2.2:8081
---
- launchApp
- openLink: audit5s://expo-development-client/?url=${METRO_URL}
- runFlow:
    when:
      visible:
        id: login-id
    commands:
      - tapOn:
          id: login-id
      - inputText: ${LOGIN_ID}
      - tapOn:
          id: password
      - inputText: ${PASSWORD}
      - hideKeyboard
      - tapOn:
          id: sign-in
- extendedWaitUntil:
    visible: "Sync now"
    timeout: 60000
# Every role now lands on Overview; a field role's version of it is the resume screen.
- takeScreenshot: tab-overview
- tapOn:
    id: field-units-tab
- extendedWaitUntil:
    visible:
      id: field-units-list
    timeout: 15000
- waitForAnimationToEnd
- assertVisible:
    id: field-units-list
- takeScreenshot: tab-units
- tapOn: "Overview"
- scrollUntilVisible:
    element:
      id: field-units-shortcut
    direction: DOWN
- tapOn:
    id: field-units-shortcut
- assertVisible:
    id: field-units-list
- tapOn: "Overview"
- runFlow:
    when:
      visible:
        id: open-field-unit
    commands:
      - tapOn:
          id: open-field-unit
      - assertVisible:
          id: field-units-list
- tapOn: "History"
- assertVisible: "Audits on this device"
- takeScreenshot: tab-history
- tapOn: "Profile"
- assertVisible: "Sync catalogue"
- takeScreenshot: tab-profile
