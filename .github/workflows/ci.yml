name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Production is pinned to PostgreSQL 18 (STACK.md §2). CI runs the same major, so a
  # migration that only works on an older one fails here rather than on the box.
  POSTGRES_IMAGE: postgres:18-alpine

jobs:
  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The host do-not-touch list (STACK.md §6). Application code must never name the
      # hosting provider: that is what preserves or voids the ~40-minute migration
      # guarantee, so it fails the build rather than being caught in review. The Oracle
      # → Hostinger move of 2026-09-17 changed infra, CI and docs and not one line under
      # apps/ or packages/ — that is the property this step defends.
      - name: No hosting-provider SDKs or endpoints in application code
        run: |
          if grep -rInE 'oci-|oraclecloud\.com|@oracle/|hostinger' apps/ packages/ \
               --include='*.ts' --include='*.tsx' --include='*.json' \
               --exclude-dir=node_modules --exclude-dir=dist; then
            echo "::error::Found a hosting-provider reference (STACK.md §6: the host do-not-touch list)."
            exit 1
          fi
          echo "clean"

      # STACK.md §6 forbids Redis. Catching a stray client here is cheaper than
      # discovering the dependency at deploy time.
      - name: No Redis client dependency
        run: |
          if grep -rInE '"(ioredis|redis|bullmq|@nestjs/bull)"' \
               apps/*/package.json packages/*/package.json package.json; then
            echo "::error::Redis is on the do-not-add list (STACK.md §6); pg-boss is the only queue."
            exit 1
          fi
          echo "clean"

  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: audit5s
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_MIGRATION_URL: postgres://audit5s_owner:audit5s_owner@127.0.0.1:5432/audit5s
      DATABASE_URL: postgres://audit5s_app:audit5s_app@127.0.0.1:5432/audit5s

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The application role is deliberately not the schema owner: it must not bypass RLS,
      # and it holds no UPDATE/DELETE on the append-only tables. CI reproduces that split,
      # because testing as a superuser would assert nothing about either.
      - name: Create database roles
        env:
          PGPASSWORD: postgres
          APP_OWNER_PASSWORD: audit5s_owner
          APP_PASSWORD: audit5s_app
        run: |
          psql -h 127.0.0.1 -U postgres -d audit5s -v ON_ERROR_STOP=1 -f infra/sql/00-roles.sql
          # Two databases: the API end-to-end suite truncates and reseeds, so sharing one
          # with the schema tests would make both flaky the moment they overlapped.
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS audit5s;" \
            -c "DROP DATABASE IF EXISTS audit5s_test;" \
            -c "CREATE DATABASE audit5s OWNER audit5s_owner;" \
            -c "CREATE DATABASE audit5s_test OWNER audit5s_owner;"

      # Phase 7's renderer. `chromium-headless-shell` is the build STACK.md §2 pins — the
      # renderer without the browser UI — and `--with-deps` installs the shared libraries
      # the GitHub runner does not ship. Only the e2e suite uses it; the unit tests assert
      # the report *layout* from HTML and need no browser at all.
      - name: Install chrome-headless-shell
        run: pnpm --filter @audit5s/api exec playwright install --with-deps chromium-headless-shell

      - run: pnpm lint
      - run: pnpm -r build
      - run: pnpm -r typecheck

      - name: Apply migrations
        run: pnpm db:migrate

      - run: pnpm -r test

      - name: Reports browser smoke
        run: pnpm --filter @audit5s/admin-web smoke:reports

      # The authorization matrix and its completeness check: a route with no matrix entry
      # fails here, which is what stops PART 6 from rotting into documentation that no
      # longer matches the code (§12.4, §15.2). Also carries the R-2 pg-boss rollback test.
      # The signing keypair is generated by test/setup-env.ts, so no key lives in CI.
      - name: End-to-end suites
        run: pnpm --filter @audit5s/api test:e2e

  build-image:
    name: Build images and backup smoke
    runs-on: ubuntu-latest
    needs: [guardrails, verify]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # amd64 only: the target is a Hostinger VPS KVM 2 (x86-64). Building arm64 too would
      # double the build for an architecture nothing runs.
      - name: Build (no push on CI)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build PostgreSQL backup image
        run: docker build -t audit5s-postgres-pgbackrest:18 -f infra/docker/postgres-pgbackrest.Dockerfile .

      - name: Verify WAL archive and full backup
        run: bash infra/tests/backup-smoke.sh

      - name: Build production web image
        run: docker build -t audit5s-web:ci -f infra/docker/web.Dockerfile .

      - name: Validate Caddy and production Compose
        run: |
          CI_APK_HASH="$(docker run --rm caddy:2-alpine caddy hash-password --plaintext 'ci-test-only-password')"

          docker run --rm \
            -v "$PWD/infra/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e APP_HOST=app.example.test \
            -e API_HOSTNAME=api.example.test \
            -e OBJECTS_HOST=objects.example.test \
            -e ACME_EMAIL=ops@example.test \
            -e APK_DOWNLOAD_PASSWORD_HASH="$CI_APK_HASH" \
            audit5s-web:ci \
            caddy validate --config /etc/caddy/Caddyfile

          docker compose --env-file .env.example config --quiet
