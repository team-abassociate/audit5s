name: Production deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # The escape hatch, added after a merged fix sat undeployed behind an unrelated flaky
  # test. Every deploy is gated on a green CI run, which is right, but it makes any
  # intermittent failure anywhere in the suite an outage extender: the only way to ship a
  # ready fix was to re-run the suite until chance went the other way.
  #
  # This does not weaken the gate. It moves the decision to a person, for the case where
  # the commit is known good and the red is known unrelated, and it records who made it.
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA on main to deploy
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish-and-deploy:
    # A workflow_run deploy still needs CI to have passed, and to have come from this
    # repository rather than a fork. A dispatch carries its own authorization: the
    # `production` environment below, and whatever approval it requires.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      # One name for the release, whichever trigger supplied it. `head_sha` is empty on a
      # dispatch, and an empty string is falsy here. `infra/deploy.sh` refuses anything
      # that is not a full SHA, and refuses one that is not a commit on this checkout, so
      # a mistyped input fails before it can touch a container.
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/team-abassociate/audit5s-api:${{ env.RELEASE_SHA }}
      - name: Publish web and Caddy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/team-abassociate/audit5s-web:${{ env.RELEASE_SHA }}
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 0700 -d ~/.ssh
          printf '%s' "$VPS_SSH_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "cd /opt/audit5s && bash ./infra/deploy.sh '$RELEASE_SHA'"
