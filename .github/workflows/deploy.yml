name: Production deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # The escape hatch, added after a merged fix sat undeployed behind an unrelated flaky
  # test. Every deploy is gated on a green CI run, which is right, but it makes any
  # intermittent failure anywhere in the suite an outage extender: the only way to ship a
  # ready fix was to re-run the suite until chance went the other way.
  #
  # This does not weaken the gate. It moves the decision to a person, for the case where
  # the commit is known good and the red is known unrelated, and it records who made it.
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA on main to deploy
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish-and-deploy:
    # A workflow_run deploy still needs CI to have passed, and to have come from this
    # repository rather than a fork. A dispatch carries its own authorization: the
    # `production` environment below, and whatever approval it requires.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      # One name for the release, whichever trigger supplied it. `head_sha` is empty on a
      # dispatch, and an empty string is falsy here. `infra/deploy.sh` refuses anything
      # that is not a full SHA, and refuses one that is not a commit on this checkout, so
      # a mistyped input fails before it can touch a container.
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/team-abassociate/audit5s-api:${{ env.RELEASE_SHA }}
      - name: Publish web and Caddy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/team-abassociate/audit5s-web:${{ env.RELEASE_SHA }}
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 0700 -d ~/.ssh
          printf '%s' "$VPS_SSH_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            { echo "::error::Expected a full commit SHA, got '$RELEASE_SHA'"; exit 1; }
          # Run the release's own deploy.sh, not the checkout's. deploy.sh checks out the
          # release partway through, and bash keeps executing the file it opened, so running
          # it from the checkout ran the *previous* release's script — a change to deploy.sh
          # only took effect one deploy late (2026-09-28: the image cleanup skipped its
          # first release). A copy outside the checkout is the script this release shipped.
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" bash -s -- "$RELEASE_SHA" <<'REMOTE'
          set -euo pipefail
          cd /opt/audit5s
          git fetch -q origin main
          script="$(mktemp)"
          trap 'rm -f "$script"' EXIT
          git show "$1:infra/deploy.sh" > "$script"
          bash "$script" "$1"
          REMOTE

  # The field app, over the air, after the server it talks to is live.
  #
  # An OTA update carries JavaScript only. It is published when this release changed the
  # app, and only while the native layer still matches the APK on the phones
  # (`apps/field-mobile/native-baseline.txt`): JavaScript sent to a binary without the native
  # code it expects crashes on an auditor's phone, so a native change stops here, red, and
  # asks for a new APK instead.
  field-app-update:
    needs: publish-and-deploy
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: field-app-update
      cancel-in-progress: false
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Did this release change the field app?
        id: changed
        run: |
          # A merge's first parent is main as it was, so this is the whole pull request.
          if git diff --quiet "$RELEASE_SHA^1" "$RELEASE_SHA" -- \
              apps/field-mobile packages/contracts packages/domain pnpm-lock.yaml; then
            echo "The field app did not change in this release; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the Expo token is configured
        if: steps.changed.outputs.publish == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          [ -n "$EXPO_TOKEN" ] || {
            echo "::error title=OTA not published::Add an EXPO_TOKEN secret (expo.dev → Access tokens) to this repository's production environment."
            exit 1
          }

      - uses: pnpm/action-setup@v4
        if: steps.changed.outputs.publish == 'true'

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.publish == 'true'
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.changed.outputs.publish == 'true'

      # The app imports these as compiled `dist/`, and a fresh checkout has none. The APK build
      # does the same in `eas-build-post-install`; without it the bundle fails to resolve them.
      - name: Build the shared packages the app imports
        if: steps.changed.outputs.publish == 'true'
        run: pnpm --filter @audit5s/domain --filter @audit5s/contracts build

      # The same address and settings as the production APK (the `vps` profile), from the
      # one place they are written down, so an update can never point phones elsewhere.
      - name: Use the production APK's build settings
        if: steps.changed.outputs.publish == 'true'
        run: |
          node -e "
            const env = require('./apps/field-mobile/eas.json').build.vps.env;
            for (const [key, value] of Object.entries(env)) console.log(key + '=' + value);
          " >> "$GITHUB_ENV"

      - name: Native layer unchanged since the installed APK?
        if: steps.changed.outputs.publish == 'true'
        run: |
          baseline="$(grep -v '^#' apps/field-mobile/native-baseline.txt | tr -d '[:space:]')"
          git worktree add -q "$RUNNER_TEMP/apk-baseline" "$baseline"
          (cd "$RUNNER_TEMP/apk-baseline" && pnpm install --frozen-lockfile --prefer-offline)
          cd apps/field-mobile
          status=0
          node scripts/native-changed.mjs "$RUNNER_TEMP/apk-baseline/apps/field-mobile" || status=$?
          if [ "$status" -eq 3 ]; then
            echo "::error title=Field app needs a new APK::This release changes native code, so it cannot go out over the air. Build a new APK (eas build --profile vps), install it on the phones, then set apps/field-mobile/native-baseline.txt to the commit it was built from."
            exit 1
          elif [ "$status" -ne 0 ]; then
            echo "::error title=OTA not published::The native check itself failed (exit $status)."
            exit 1
          fi

      - uses: expo/expo-github-action@v8
        if: steps.changed.outputs.publish == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish the OTA update
        if: steps.changed.outputs.publish == 'true'
        working-directory: apps/field-mobile
        run: |
          # A merge commit's body is the pull request's title: the line an admin reads in Expo.
          title="$(git log -1 --format=%b "$RELEASE_SHA" | head -n 1)"
          [ -n "$title" ] || title="$(git log -1 --format=%s "$RELEASE_SHA")"
          eas update --channel production --platform android --environment production \
            --message "$title (${RELEASE_SHA:0:7})" --non-interactive
