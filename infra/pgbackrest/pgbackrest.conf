# Encrypted PostgreSQL repository on the VPS. Hostinger's weekly VPS snapshot is the
# separate copy; a complete VPS loss can still lose up to a week of changes.
[global]
repo1-type=posix
repo1-path=/repo
repo1-cipher-type=aes-256-cbc
repo1-retention-full=2
process-max=2
compress-type=zst
compress-level=6
log-level-console=info
log-level-file=off
start-fast=y

[audit5s]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-socket-path=/var/run/postgresql
