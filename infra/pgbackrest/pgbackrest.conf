# pgBackRest → Cloudflare R2 (STACK.md §2).
#
# Continuous WAL + daily incremental + weekly full, encrypted with aes-256-cbc before it
# leaves the host. RPO ≤5 min, RTO ≤4 h (§12.14).
#
# The two rules this configuration exists to serve:
#   - if the VM is destroyed right now, the acceptable loss is under five minutes of
#     database writes and nothing else;
#   - an untested backup is a rumour. The quarterly restore drill is mandatory, and
#     `infra/README.md` carries the runbook.

[global]
repo1-type=s3
repo1-s3-endpoint=%R2_ENDPOINT%
repo1-s3-bucket=%R2_BUCKET_BACKUP%
repo1-s3-region=auto
repo1-s3-uri-style=path
repo1-path=/pgbackrest

# Encrypted client-side: the repository holds ciphertext, so a leaked R2 credential does
# not hand over the database. The passphrase lives only in the password manager — losing
# it makes every backup unreadable, which is why the restore drill checks it too.
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=%PGBACKREST_CIPHER_PASS%

repo1-retention-full=4
repo1-retention-diff=7

process-max=2
compress-type=zst
compress-level=6
log-level-console=info
log-level-file=detail
start-fast=y

# Multipart only above ~8 MB: R2 Class A operations are billed per million and multipart
# generates more of them than expected (STACK.md §9).
repo1-s3-key-type=shared

[audit5s]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-host=postgres
pg1-user=postgres
