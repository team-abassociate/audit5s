# Production: one VPS, seven containers. Only Caddy publishes public ports.
name: audit5s

x-api-image: &api-image ${API_IMAGE:-ghcr.io/team-abassociate/audit5s-api:latest}
x-pgbackrest-env: &pgbackrest-env
  PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_CIPHER_PASS}
  PGBACKREST_PG1_USER: ${POSTGRES_SUPERUSER:-postgres}
x-api-env: &api-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: ${DATABASE_URL}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  PGBOSS_POOL_MAX: ${PGBOSS_POOL_MAX:-4}
  JWT_PRIVATE_KEY_B64: ${JWT_PRIVATE_KEY_B64}
  JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64}
  JWT_ISSUER: ${JWT_ISSUER}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-audit5s}
  ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-0}
  BOOTSTRAP_PASSWORD_TTL_HOURS: ${BOOTSTRAP_PASSWORD_TTL_HOURS:-72}
  WEB_APP_URL: https://${APP_HOST}
  S3_ENDPOINT: https://${OBJECTS_HOST}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  S3_BUCKET: ${S3_BUCKET:-audit5s-private}
  CHECKLIST_IMPORT_MAX_BYTES: ${CHECKLIST_IMPORT_MAX_BYTES:-10485760}
  CHECKLIST_IMPORT_PREVIEW_TTL_HOURS: ${CHECKLIST_IMPORT_PREVIEW_TTL_HOURS:-24}
  PGBOSS_SCHEMA: ${PGBOSS_SCHEMA:-pgboss}
  PGBOSS_JOB_RETENTION_DAYS: ${PGBOSS_JOB_RETENTION_DAYS:-7}
  SENTRY_DSN: ${SENTRY_DSN:-}

services:
  postgres:
    image: audit5s-postgres-pgbackrest:18
    build:
      context: .
      dockerfile: infra/docker/postgres-pgbackrest.Dockerfile
    restart: unless-stopped
    mem_limit: 2304m
    shm_size: 256m
    oom_score_adj: -500
    environment:
      <<: *pgbackrest-env
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: audit5s
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgsocket:/var/run/postgresql
      - backuprepo:/repo
      - ./infra/pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    command:
      - postgres
      - -c
      - archive_timeout=60
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=audit5s archive-push %p
      - -c
      - shared_buffers=576MB
      - -c
      - effective_cache_size=1728MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=40
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d audit5s']
      interval: 10s
      timeout: 5s
      retries: 5

  object-storage:
    image: ${MINIO_IMAGE:-quay.io/minio/aistor/minio:RELEASE.2026-03-26T21-24-40Z}
    restart: unless-stopped
    mem_limit: 768m
    command: ['minio', 'server', '/data', '--console-address', ':9001', '--license', '/minio.license']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: https://${APP_HOST}
    volumes:
      - objectdata:/data
      - ./infra/.local/minio.license:/minio.license:ro
    # Administrative CLI access on the host only. The console is never published.
    ports:
      - '127.0.0.1:9000:9000'

  api:
    image: *api-image
    restart: unless-stopped
    mem_limit: 768m
    stop_grace_period: 180s
    command: ['node', 'dist/main.js']
    environment:
      <<: *api-env
      API_PORT: 3000
      API_HOST: 0.0.0.0
      CORS_ORIGINS: https://${APP_HOST}
    depends_on:
      postgres:
        condition: service_healthy
      object-storage:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:3000/api/v1/health\").then(r=>r.json()).then(h=>process.exit(h.status===\"error\"?1:0)).catch(()=>process.exit(1))"']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker-general:
    image: *api-image
    restart: unless-stopped
    stop_grace_period: 180s
    mem_limit: 512m
    command: ['node', 'dist/worker.general.js']
    environment:
      <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      object-storage:
        condition: service_started

  worker-report:
    image: *api-image
    restart: unless-stopped
    stop_grace_period: 180s
    mem_limit: 1536m
    shm_size: 256m
    command: ['node', 'dist/worker.report.js']
    environment:
      <<: *api-env
      REPORT_CONCURRENCY: 1
      CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium-browser
    depends_on:
      postgres:
        condition: service_healthy
      object-storage:
        condition: service_started

  pgbackrest:
    image: audit5s-postgres-pgbackrest:18
    build:
      context: .
      dockerfile: infra/docker/postgres-pgbackrest.Dockerfile
    user: postgres
    command: ['sleep', 'infinity']
    restart: unless-stopped
    mem_limit: 384m
    environment:
      <<: *pgbackrest-env
    volumes:
      - ./infra/pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - pgdata:/var/lib/postgresql/data
      - pgsocket:/var/run/postgresql
      - backuprepo:/repo
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: ${WEB_IMAGE:-ghcr.io/team-abassociate/audit5s-web:latest}
    restart: unless-stopped
    mem_limit: 128m
    environment:
      APP_HOST: ${APP_HOST}
      API_HOSTNAME: ${API_HOSTNAME}
      OBJECTS_HOST: ${OBJECTS_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
      APK_DOWNLOAD_PASSWORD_HASH: ${APK_DOWNLOAD_PASSWORD_HASH}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddydata:/data
      - caddyconfig:/config
      - ./infra/.local/releases:/srv/downloads:ro
      - ./infra/.local/well-known:/srv/.well-known:ro
    networks:
      default:
        aliases:
          - ${OBJECTS_HOST}
    depends_on:
      - api
      - object-storage

volumes:
  pgdata:
  pgsocket:
  backuprepo:
  objectdata:
  caddydata:
  caddyconfig:
