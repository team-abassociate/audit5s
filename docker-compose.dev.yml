# Local development uses the signed filesystem storage driver. This volume is shared by
# the API and both workers so report and evidence reads see the uploaded bytes.
services:
  postgres:
    # The production archive target is disabled with its backup sidecar in development.
    command: !override ['postgres', '-c', 'archive_mode=off']
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_PASSWORD: postgres
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:?Set APP_OWNER_PASSWORD in .env}
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env}
    volumes:
      - ./infra/sql/00-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    image: audit5s-api:dev
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      CORS_ORIGINS: http://localhost:5173
      S3_ENDPOINT: ''
      OBJECT_STORAGE_LOCAL_DIR: /data/objects
      OBJECT_STORAGE_PUBLIC_URL: http://127.0.0.1:3000/api/v1
      OBJECT_STORAGE_SIGNING_SECRET: audit5s-development-signing-secret
    volumes:
      - devobjects:/data/objects
    depends_on: !override
      postgres:
        condition: service_healthy

  worker-general:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    image: audit5s-api:dev
    environment:
      NODE_ENV: development
      S3_ENDPOINT: ''
      OBJECT_STORAGE_LOCAL_DIR: /data/objects
      OBJECT_STORAGE_PUBLIC_URL: http://127.0.0.1:3000/api/v1
      OBJECT_STORAGE_SIGNING_SECRET: audit5s-development-signing-secret
    volumes:
      - devobjects:/data/objects
    depends_on: !override
      postgres:
        condition: service_healthy

  worker-report:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    image: audit5s-api:dev
    environment:
      NODE_ENV: development
      S3_ENDPOINT: ''
      OBJECT_STORAGE_LOCAL_DIR: /data/objects
      OBJECT_STORAGE_PUBLIC_URL: http://127.0.0.1:3000/api/v1
      OBJECT_STORAGE_SIGNING_SECRET: audit5s-development-signing-secret
    volumes:
      - devobjects:/data/objects
    depends_on: !override
      postgres:
        condition: service_healthy

  object-storage:
    profiles: ['production-only']

  caddy:
    profiles: ['production-only']

  pgbackrest:
    profiles: ['production-only']

volumes:
  devobjects:
