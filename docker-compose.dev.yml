# Local development override.
#
# It runs the same PostgreSQL 18 as production and adds MinIO as an S3-compatible
# stand-in for R2. That is a dev convenience only, permitted because `R2_ENDPOINT` is an
# environment variable: nothing in apps/ or packages/ references MinIO by name, so this
# is not a second production dependency (HANDOFF.md §5.2).
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  postgres:
    ports:
      - '5432:5432'
    environment:
      POSTGRES_SUPERUSER_PASSWORD: postgres
      POSTGRES_PASSWORD: postgres

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    image: audit5s-api:dev
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      CORS_ORIGINS: http://localhost:5173

  worker-general:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    image: audit5s-api:dev

  worker-report:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    image: audit5s-api:dev

  # Not part of the production topology. Present so evidence upload and report storage
  # can be exercised locally without a Cloudflare account.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    mem_limit: 512m
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: audit5s
      MINIO_ROOT_PASSWORD: audit5s-dev-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

  # Neither belongs in a local stack: there is no tunnel to run and no repository to
  # back up to. Scaled to zero rather than deleted, so the file stays a pure override.
  cloudflared:
    deploy:
      replicas: 0
    profiles: ['never']

  pgbackrest:
    deploy:
      replicas: 0
    profiles: ['never']

volumes:
  miniodata:
